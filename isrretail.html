  <div class="retail">
    <h2>UBA Internet Banking Instant Self-Registration (Retail)</h2>
  </div>

  <!-- section 26 -->
  <div class="sec26">
    <div class="retailcont">
      <h3>To register, please provide your UBA Debit Card Details</h3>
      <p>if you don't have a debit card, <a class="redd" href="">Click Here</a></p>

      <div class="cardinput">
        <div>
          <img src="/Gallery/cardinput.png" alt="">
        </div>

        <div class="inputarea">

          <div class="inputgroup">
            <label>Account Number<span class="star">*</span></label>
            <input type="text" class="inputline">
          </div>

          <div class="red3">
            <h3> Card Details</h3>
          </div>

          <div class="inputgroup">
            <label>First 6 digits<span class="star">*</span></label>
            <input type="text" maxlength="6" class="inputline">
          </div>

          <div class="inputgroup">
            <label>Last 4 digits<span class="star">*</span></label>
            <input type="text" maxlength="4" class="inputline">
          </div>

          <div class="inputgroup">
            <label>Debit Card PIN<span class="star">*</span></label>
            <input type="text" maxlength="4" class="inputline">
          </div>

          <div class="inputgroup">
            <label>Expiry Date(YYYY-MM)<span class="star">*</span></label>
            <input type="text" placeholder="YYYY-MM" class="inputline">
          </div>

          <div class="inputgroup">
            <label>Referral ID(Optional)</label>
            <input type="text" class="inputline">
          </div>

          <div class="conbac2">
            <button class="con1"><a href="/isrretail.html">Continue</a></button>
            <button class="bac2">Back</button>
          </div>
        </div>
      </div>
    </div>
